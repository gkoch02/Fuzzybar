name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Build-script and Xcode-project tests
        run: python3 -m unittest discover -s Tests/BuildScriptTests -v
